<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark circular badge -->
  <circle cx="32" cy="32" r="30" fill="#0b1220"/>
  <circle cx="32" cy="32" r="29" stroke="#1e293b" stroke-width="1"/>

  <!-- Soft glow -->
  <circle cx="32" cy="32" r="18" fill="url(#glow)" opacity="0.55"/>

  <!-- Three orbital ellipses (atom / React-style) -->
  <g stroke="#7dd3fc" stroke-width="1.6" fill="none" opacity="0.95">
    <ellipse cx="32" cy="32" rx="20" ry="8" transform="rotate(0 32 32)"/>
    <ellipse cx="32" cy="32" rx="20" ry="8" transform="rotate(60 32 32)"/>
    <ellipse cx="32" cy="32" rx="20" ry="8" transform="rotate(120 32 32)"/>
  </g>

  <!-- Nucleus -->
  <circle cx="32" cy="32" r="3.2" fill="#e0f2fe"/>
  <circle cx="32" cy="32" r="3.2" fill="#7dd3fc" opacity="0.55"/>

  <!-- Electron nodes on orbits -->
  <circle cx="52" cy="32" r="2.4" fill="#bae6fd"/>
  <circle cx="22" cy="14.7" r="2.4" fill="#bae6fd"/>
  <circle cx="22" cy="49.3" r="2.4" fill="#bae6fd"/>

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
